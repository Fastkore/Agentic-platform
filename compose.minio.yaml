# Optional, self-contained S3 service for a local deployment.
services:
  app:
    environment:
      BRIDGE_S3_ENDPOINT: http://minio:9000
      BRIDGE_S3_BUCKET: agentic-platform-files
      BRIDGE_S3_REGION: us-east-1
      BRIDGE_S3_FORCE_PATH_STYLE: "1"
      BRIDGE_S3_ACCESS_KEY: agentic-platform
      BRIDGE_S3_SECRET_KEY: ""
      BRIDGE_S3_SECRET_KEY_FILE: /run/secrets/minio-password
      BRIDGE_S3_CREATE_BUCKET: "1"
    secrets:
      - source: minio_password
        target: minio-password
    networks: [default, file_storage]
  minio:
    build:
      context: .
      dockerfile: deploy/minio.Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MINIO_ROOT_USER: agentic-platform
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio-password
    secrets:
      - source: minio_password
        target: minio-password
    volumes:
      - minio_objects:/objects
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks: [file_storage]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9000/minio/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
secrets:
  minio_password:
    file: ./private/minio-password
volumes:
  minio_objects:
networks:
  file_storage:
    internal: true
