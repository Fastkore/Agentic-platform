services:
  app:
    environment:
      BRIDGE_FASTKORE_CLI_SOCKET: /run/fastkore-cli/pilot.sock
      BRIDGE_FASTKORE_CLI_STDOUT_MAX_BYTES: ${BRIDGE_FASTKORE_CLI_STDOUT_MAX_BYTES:-8388608}
    volumes:
      - fastkore_cli_ticket_socket:/run/fastkore-cli:ro
volumes:
  fastkore_cli_ticket_socket:
    external: true
