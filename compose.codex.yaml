# The worker shares the Unix socket and temporary job files with the platform.
services:
  app:
    environment:
      BRIDGE_EXECUTION: isolated
      BRIDGE_CODEX_SOCKET: /run/bridge-codex/worker.sock
      BRIDGE_CODEX_JOB_FILES: /run/bridge-work
    volumes:
      - codex_socket:/run/bridge-codex:ro
      - codex_job_files:/run/bridge-work
    depends_on:
      codex:
        condition: service_healthy
  codex:
    build:
      context: .
      dockerfile: Dockerfile.codex
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/codex-seccomp.json
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    environment:
      HTTPS_PROXY: ${BRIDGE_CODEX_HTTPS_PROXY:-}
      BRIDGE_GLM_BASE_URL: ${BRIDGE_GLM_BASE_URL:-}
      BRIDGE_CODEX_JOB_FILES: /runner/jobs
    volumes:
      - codex_socket:/run/bridge-codex
      - codex_auth:/home/node/.codex
      - codex_job_files:/runner/jobs
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks: [codex_egress]
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('node:http').get({socketPath:'/run/bridge-codex/worker.sock',path:'/health'},s=>{s.resume();process.exit(s.statusCode===200?0:1)});r.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  codex_socket:
  codex_auth:
  codex_job_files:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m,uid=1000,gid=1000,mode=0700,nosuid,nodev
networks:
  codex_egress:
