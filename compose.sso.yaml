# Opt-in pilot overlay; the default compose.yaml has no SSO secrets or Codex credentials.
# docker compose -f compose.yaml -f compose.sso.yaml up -d --build
services:
  app:
    environment:
      BRIDGE_TRUST_PROXY: ${BRIDGE_TRUST_PROXY:?Set exact proxy address seen by the app}
      BRIDGE_SSO_KEY_FILE: /run/secrets/fastkore-sso-key
      NODE_EXTRA_CA_CERTS: ${BRIDGE_FASTKORE_CA_FILE:-}
    volumes:
      - ./private/fastkore-ca:/run/fastkore-ca:ro
    secrets:
      - source: fastkore_sso_key
        target: fastkore-sso-key
secrets:
  fastkore_sso_key:
    file: ./private/fastkore-sso.key
