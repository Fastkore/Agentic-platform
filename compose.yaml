services:
  app:
    build: .
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      BRIDGE_DATA_DIR: /data
      BRIDGE_PROJECTS_DIR: /projects
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_EXECUTION: disabled
      BRIDGE_PUBLIC_ORIGIN: ${BRIDGE_PUBLIC_ORIGIN:?Set HTTPS origin in .env}
      BRIDGE_DICTATION_URL: ${BRIDGE_DICTATION_URL:-}
      BRIDGE_DICTATION_TOKEN_FILE: /run/dictation/token
      BRIDGE_S3_ENDPOINT: ${BRIDGE_S3_ENDPOINT:-}
      BRIDGE_S3_BUCKET: ${BRIDGE_S3_BUCKET:-}
      BRIDGE_S3_REGION: ${BRIDGE_S3_REGION:-us-east-1}
      BRIDGE_S3_FORCE_PATH_STYLE: ${BRIDGE_S3_FORCE_PATH_STYLE:-1}
      BRIDGE_S3_ACCESS_KEY: ${BRIDGE_S3_ACCESS_KEY:-}
      BRIDGE_S3_SECRET_KEY: ${BRIDGE_S3_SECRET_KEY:-}
    volumes:
      - ./data:/data
      - ./projects:/projects
      - ./private/dictation:/run/dictation:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
